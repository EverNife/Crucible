name: EverNife pre-release build

on:
  push:
    branches:
      - staging-evernife

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Show Gradle version
      run: ./gradlew --version

    - name: Setup Crucible
      run: ./gradlew cleanCache clean setupCrucible --refresh-dependencies

    - name: Build Crucible distribution packages
      run: ./gradlew buildPackages

    - name: Get commit count
      id: commit_count
      run: |
        echo "count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

    - name: Get short SHA
      id: short_sha
      run: |
        echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Rename JAR with dev version
      run: |
        for file in build/distributions/*-server.jar; do
          mv "$file" "build/distributions/Crucible-1.7.10-staging-evernife-${{ steps.short_sha.outputs.sha }}-ever-dev-${{ steps.commit_count.outputs.count }}-server.jar"
        done

    - name: Create GitHub pre-release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: staging-evernife-${{ steps.short_sha.outputs.sha }}
        prerelease: true
        name: EverNife Staging Build ${{ steps.short_sha.outputs.sha }} | ever-dev-${{ steps.commit_count.outputs.count }}
        body: |
          This is an automatic pre-release build from the EverNife fork's staging-evernife branch.
          It carries changes that are not in CrucibleMC/Crucible yet, so it is not the upstream build.
          
          Commit: ${{ github.sha }}
          Build number: ever-dev-${{ steps.commit_count.outputs.count }}
        files: |
          build/distributions/*
          java9args.txt
